name: selftest

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m py_compile vt.py
      - name: scaffold, edit, validate
        run: |
          mkdir -p /tmp/t && cd /tmp/t
          VT="python3 $GITHUB_WORKSPACE/vt.py"
          $VT new Probe dev.vetheuil.probe --display-name "Vétheuil Probe"
          $VT add-package https://github.com/apple/swift-collections Collections --from 1.1.0
          $VT set SWIFT_STRICT_CONCURRENCY complete
          $VT unset SWIFT_STRICT_CONCURRENCY
          $VT inspect > /dev/null
          $VT detect

  macos:
    needs: linux
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: scaffold + package + code that uses it
        run: |
          mkdir -p /tmp/t && cd /tmp/t
          VT="python3 $GITHUB_WORKSPACE/vt.py"
          $VT new Probe dev.vetheuil.probe --display-name "Vétheuil Probe"
          $VT add-package https://github.com/apple/swift-collections Collections --from 1.1.0
          cat > Probe/CollectionsProbe.swift <<'EOF'
          import Collections

          func collectionsProbe() -> Int {
              let set: OrderedSet<Int> = [3, 1, 2, 3]
              return set.count
          }
          EOF
      - name: xcodebuild (unsigned)
        run: |
          cd /tmp/t
          xcodebuild -version
          set +e
          xcodebuild -project Probe.xcodeproj -scheme Probe -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          python3 "$GITHUB_WORKSPACE/vt.py" digest build.log --markdown >> "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/vt.py" digest build.log
          exit $status
